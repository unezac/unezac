<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4a017"><animate attributeName="stop-color" values="#d4a017;#ff8c00;#d4a017" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#ff8c00"><animate attributeName="stop-color" values="#ff8c00;#d4a017;#ff8c00" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
    <style>
      .t{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .s{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#8b949e}
      .l{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#c9d1d9}
      .c{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .a{opacity:0;animation:in .8s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
      .float{animation:fl 4s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    </style>
  </defs>
  <g class="float">
    <rect x="3" y="3" width="474" height="244" rx="16" fill="#0d1117" stroke="url(#b)" stroke-width="2.5"/>
    <rect x="3" y="3" width="474" height="244" rx="16" fill="url(#b)" opacity=".07"/>
    <text x="28" y="52" class="t a" style="animation-delay:.1s">MANAHIL-ASL</text>
    <text x="28" y="78" class="s a" style="animation-delay:.25s">E-commerce for premium Moroccan honey</text>
    <text x="28" y="118" class="l a" style="animation-delay:.4s">▸ Custom MVC architecture in PHP 8.1+</text>
    <text x="28" y="144" class="l a" style="animation-delay:.55s">▸ Arabic / French i18n and SEO sitemap</text>
    <text x="28" y="170" class="l a" style="animation-delay:.7s">▸ PayPal webhooks, PHPUnit and CI</text>
    <rect x="28" y="196" width="56" height="26" rx="13" fill="url(#b)" opacity=".9"/><text x="56" y="213" text-anchor="middle" class="c">PHP</text><rect x="92" y="196" width="66" height="26" rx="13" fill="url(#b)" opacity=".9"/><text x="125" y="213" text-anchor="middle" class="c">MySQL</text><rect x="166" y="196" width="62" height="26" rx="13" fill="url(#b)" opacity=".9"/><text x="197" y="213" text-anchor="middle" class="c">PWA</text><rect x="236" y="196" width="76" height="26" rx="13" fill="url(#b)" opacity=".9"/><text x="274" y="213" text-anchor="middle" class="c">PayPal</text>
  </g>
</svg>
