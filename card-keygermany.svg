<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#7c5cff;#00d4ff" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#7c5cff"><animate attributeName="stop-color" values="#7c5cff;#00d4ff;#7c5cff" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
    <style>
      .t{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .s{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#8b949e}
      .l{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#c9d1d9}
      .c{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .a{opacity:0;animation:in .8s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
      .float{animation:fl 4s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    </style>
  </defs>
  <g class="float">
    <rect x="3" y="3" width="474" height="244" rx="16" fill="#0d1117" stroke="url(#b)" stroke-width="2.5"/>
    <rect x="3" y="3" width="474" height="244" rx="16" fill="url(#b)" opacity=".07"/>
    <text x="28" y="52" class="t a" style="animation-delay:.1s">KeyGermany</text>
    <text x="28" y="78" class="s a" style="animation-delay:.25s">German typing trainer</text>
    <text x="28" y="118" class="l a" style="animation-delay:.4s">▸ Real-time validation and accuracy tracking</text>
    <text x="28" y="144" class="l a" style="animation-delay:.55s">▸ A1-C1 levels, audio and 3 UI languages</text>
    <text x="28" y="170" class="l a" style="animation-delay:.7s">▸ FastAPI REST API with SQLAlchemy</text>
    <rect x="28" y="196" width="70" height="26" rx="13" fill="url(#b)" opacity=".9"/><text x="63" y="213" text-anchor="middle" class="c">Python</text><rect x="106" y="196" width="76" height="26" rx="13" fill="url(#b)" opacity=".9"/><text x="144" y="213" text-anchor="middle" class="c">FastAPI</text><rect x="190" y="196" width="80" height="26" rx="13" fill="url(#b)" opacity=".9"/><text x="230" y="213" text-anchor="middle" class="c">SQLite</text><rect x="278" y="196" width="46" height="26" rx="13" fill="url(#b)" opacity=".9"/><text x="301" y="213" text-anchor="middle" class="c">JS</text>
  </g>
</svg>
