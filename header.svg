<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"><animate attributeName="stop-color" values="#7c5cff;#00d4ff;#ff5cae;#7c5cff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00d4ff"><animate attributeName="stop-color" values="#00d4ff;#ff5cae;#7c5cff;#00d4ff" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#00d4ff" stop-opacity=".4"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
    <style>
      .hello{font:500 20px 'Segoe UI',Arial,sans-serif;fill:#8b949e;letter-spacing:6px;opacity:0;animation:up 1s .2s ease-out forwards}
      .name{font:800 68px 'Segoe UI',Arial,sans-serif;fill:url(#txt);opacity:0;animation:up 1.1s .5s cubic-bezier(.2,.8,.2,1) forwards}
      .role{font:400 22px 'Segoe UI',Arial,sans-serif;fill:#c9d1d9;opacity:0;animation:up 1.1s .9s ease-out forwards}
      .line{stroke:url(#txt);stroke-width:3;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.4s 1.2s ease-out forwards}
      @keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
      @keyframes draw{to{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)" rx="18"/>
  <circle cx="200" cy="80" r="220" fill="url(#glow1)"><animate attributeName="cx" values="200;320;200" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="80;140;80" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="230" r="240" fill="url(#glow2)"><animate attributeName="cx" values="820;700;820" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="230;160;230" dur="14s" repeatCount="indefinite"/></circle>
  <g fill="#fff" opacity=".7">
    <circle cx="120" cy="60" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="70" r="2"><animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="250" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="200" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="190" r="1.5"><animate attributeName="opacity" values=".3;1;.3" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="95" text-anchor="middle" class="hello">HELLO, I'M</text>
  <text x="500" y="170" text-anchor="middle" class="name">Abdellah Selmani</text>
  <text x="500" y="212" text-anchor="middle" class="role">Full-Stack Developer · PHP · Python · Web Apps</text>
  <line x1="380" y1="240" x2="620" y2="240" class="line"/>
</svg>
